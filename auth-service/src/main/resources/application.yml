server:
  port: ${PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  max-http-request-header-size: 16KB

spring:
  application:
    name: sherlock-auth-service
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

sherlock:
  seed:
    enabled: ${SEED_DEMO_DATA:false}
  mail:
    enabled: ${MAIL_ENABLED:false}
    log-reset-links: false
  auth:
    issuer: ${AUTH_ISSUER:sherlock-auth}
    jwt-private-key-base64: ${JWT_PRIVATE_KEY_BASE64}
    jwt-public-key-base64: ${JWT_PUBLIC_KEY_BASE64}
    jwt-key-id: ${JWT_KEY_ID:sherlock-auth-rs256-1}
    encryption-key-base64: ${MFA_ENCRYPTION_KEY_BASE64}
    access-ttl: 15m
    refresh-ttl: 7d
    mfa-ttl: 5m
    reset-ttl: 30m
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8443,https://sherlock-in.vercel.app}
    reset-url: ${PASSWORD_RESET_URL:https://sherlock-in.vercel.app/reset-password}
    mail-from: ${MAIL_FROM:no-reply@sherlock.in}

management:
  health:
    mail:
      enabled: ${MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
