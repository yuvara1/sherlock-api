spring:
  datasource:
    url: jdbc:h2:mem:sherlock;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: localhost

sherlock:
  mail:
    enabled: false
  auth:
    issuer: sherlock-test
    jwt-private-key-base64: 
    jwt-public-key-base64: 
    jwt-key-id: sherlock-test-rs256-1
    encryption-key-base64: YmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmI=
    access-ttl: 15m
    refresh-ttl: 7d
    mfa-ttl: 5m
    reset-ttl: 30m
    allowed-origins:
      - http://localhost:5173
    reset-url: http://localhost:5173/reset-password
    mail-from: test@sherlock.local
